[package]
name = "idb_import"
version = "0.1.0"
authors = ["Rubens Brandao <git@rubens.io>"]
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = { version = "1.0.86", features = ["backtrace"] }
binaryninja = { path = "../../rust" }
binaryninjacore-sys = { path = "../../rust/binaryninjacore-sys"  }
idb-rs = { git = "https://github.com/Vector35/idb-rs", tag = "0.1.6" }
log = "0.4.20"

[profile.release]
lto = true
debug = "full"
