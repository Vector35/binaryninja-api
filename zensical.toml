            { "Time Travel Debugging (Linux)" = "guide/debugger/gdbrsp-ttd.md" },
            { "Kernel Debugging (Windows)" = "guide/debugger/windows-kd.md" },
            { "Corellium Remote Debugging" = "guide/debugger/corellium-remote-debugging.md" },
